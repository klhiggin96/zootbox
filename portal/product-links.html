<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Links - ZootBox Portal</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet"/>

  <!-- Material Symbols -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

  <!-- Tailwind Config -->
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#0d7ff2",
            "background-light": "#f5f7f8",
            "background-dark": "#101922",
          },
          fontFamily: {
            "display": ["Inter"]
          },
          borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
        },
      },
    }
  </script>
</head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-white font-display overflow-hidden">

  <div class="flex h-screen w-full bg-background-light dark:bg-background-dark">

    <!-- Left Sidebar -->
    <div id="sidebar" class="hidden md:flex flex-col w-64 border-r border-slate-200 dark:border-slate-800 bg-white dark:bg-[#111418] shrink-0">
      <!-- Sidebar content will be rendered by Sidebar.js -->
    </div>

    <!-- Main Content Area -->
    <div class="flex-1 flex flex-col min-w-0 overflow-hidden">

      <!-- Header -->
      <header class="h-16 flex items-center justify-between px-6 border-b border-slate-200 dark:border-slate-800 bg-white dark:bg-[#111418] shrink-0">
        <div class="flex items-center gap-4">
          <h2 class="text-lg font-bold">Product Links</h2>
        </div>
        <div class="flex items-center gap-3">
          <!-- Theme Toggle -->
          <div id="theme-toggle-container"></div>
        </div>
      </header>

      <!-- Main Content -->
      <main class="flex-1 overflow-y-auto p-6 md:p-8 bg-background-light dark:bg-background-dark">
        <div class="max-w-6xl mx-auto flex flex-col gap-6">

          <!-- Page Header -->
          <div class="flex justify-between items-start">
            <div>
              <h1 class="text-2xl font-bold mb-2">Product Links</h1>
              <p class="text-slate-500 dark:text-slate-400 text-sm">
                Product links allow multiple coils to be linked to a single product SKU. When a product is purchased, the system automatically selects the first available coil from the linked group.
              </p>
            </div>
            <button id="create-link-btn" class="flex items-center gap-2 px-4 py-2 bg-primary text-white hover:bg-blue-600 rounded-lg text-sm font-medium transition-colors disabled:opacity-50 disabled:cursor-not-allowed" disabled>
              <span class="material-symbols-outlined text-[18px]">add</span>
              Create Product Link
            </button>
          </div>

          <!-- Product Links Table -->
          <div class="bg-white dark:bg-[#111418] rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm overflow-hidden">
            <div class="px-6 py-4 border-b border-slate-200 dark:border-slate-800">
              <h3 class="text-lg font-bold">Existing Product Links</h3>
            </div>

            <div id="links-table-container" class="p-6">
              <div class="flex flex-col items-center justify-center gap-4 py-12">
                <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-primary"></div>
                <p class="text-slate-500">Loading product links...</p>
              </div>
            </div>
          </div>

        </div>
      </main>
    </div>

  </div>

  <!-- Toast Container -->
  <div id="toast-container"></div>

  <!-- JavaScript Modules -->
  <script type="module">
    import { initSidebar } from './js/components/Sidebar.js';
    import { initThemeToggle, createThemeToggleButton } from './js/components/ThemeToggle.js';
    import { getProductLinks, createProductLink, deleteProductLink, parseLinkedCoilIds, formatLinkedCoilIds } from './js/api/products.js';
    import { getCurrentMachineId } from './js/state/machines.js';
    import { showToast } from './js/components/Toast.js';
    import { showModal, confirmDialog } from './js/components/Modal.js';
    import { formatDateTime } from './js/utils/formatting.js';
    import { validateProductSku } from './js/utils/validation.js';

    let currentLinks = [];

    // Initialize page
    async function initPage() {
      // Initialize theme toggle
      initThemeToggle();

      // Add theme toggle button to header
      const themeToggleContainer = document.getElementById('theme-toggle-container');
      if (themeToggleContainer) {
        const toggleBtn = createThemeToggleButton({ iconOnly: true });
        themeToggleContainer.appendChild(toggleBtn);
      }

      // Initialize sidebar
      initSidebar();

      // Load links
      await loadProductLinks();

      // Create link button handler
      document.getElementById('create-link-btn').addEventListener('click', showCreateLinkModal);
    }

    // Load product links
    async function loadProductLinks() {
      const machineId = getCurrentMachineId();
      const container = document.getElementById('links-table-container');
      const createBtn = document.getElementById('create-link-btn');

      if (!machineId) {
        container.innerHTML = `
          <div class="flex flex-col items-center justify-center gap-4 py-12">
            <span class="material-symbols-outlined text-6xl text-slate-300">devices</span>
            <h2 class="text-xl font-bold text-slate-700 dark:text-slate-300">No Machine Selected</h2>
            <p class="text-slate-500 dark:text-slate-400">Please select a machine from the dropdown above.</p>
          </div>
        `;
        createBtn.disabled = true;
        return;
      }

      createBtn.disabled = false;

      try {
        const links = await getProductLinks();
        currentLinks = links;

        if (links.length === 0) {
          container.innerHTML = `
            <div class="flex flex-col items-center justify-center gap-4 py-12">
              <span class="material-symbols-outlined text-6xl text-slate-300">link_off</span>
              <h2 class="text-xl font-bold text-slate-700 dark:text-slate-300">No Product Links</h2>
              <p class="text-slate-500 dark:text-slate-400">Create a product link to allow multiple coils to serve the same product.</p>
            </div>
          `;
          return;
        }

        renderLinksTable(links);

      } catch (error) {
        console.error('Failed to load product links:', error);
        showToast('Failed to load product links: ' + error.message, 'error');
        container.innerHTML = `
          <div class="flex flex-col items-center justify-center gap-4 py-12">
            <span class="material-symbols-outlined text-6xl text-red-500">error</span>
            <h2 class="text-xl font-bold text-slate-700 dark:text-slate-300">Error Loading Product Links</h2>
            <p class="text-slate-500 dark:text-slate-400">${error.message}</p>
            <button class="px-4 py-2 bg-primary text-white rounded-lg font-medium hover:bg-blue-600 transition-colors" onclick="location.reload()">Retry</button>
          </div>
        `;
      }
    }

    // Render product links table
    function renderLinksTable(links) {
      const container = document.getElementById('links-table-container');

      let html = `
        <div class="overflow-x-auto">
          <table class="w-full">
            <thead class="bg-slate-50 dark:bg-[#1e2732] border-b border-slate-200 dark:border-slate-800">
              <tr>
                <th class="px-4 py-3 text-left text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Product SKU</th>
                <th class="px-4 py-3 text-left text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Linked Coils</th>
                <th class="px-4 py-3 text-left text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Strategy</th>
                <th class="px-4 py-3 text-left text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Created At</th>
                <th class="px-4 py-3 text-right text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Actions</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-slate-200 dark:divide-slate-800">
      `;

      links.forEach(link => {
        const coilIds = formatLinkedCoilIds(link.linked_coil_ids);
        const coilCount = parseLinkedCoilIds(link.linked_coil_ids).length;

        html += `
          <tr class="hover:bg-slate-50 dark:hover:bg-[#1e2732] transition-colors">
            <td class="px-4 py-4">
              <div class="flex items-center gap-3">
                <div class="h-10 w-10 flex items-center justify-center bg-primary/10 rounded-lg">
                  <span class="material-symbols-outlined text-primary">link</span>
                </div>
                <span class="font-bold text-slate-900 dark:text-white">${link.product_sku}</span>
              </div>
            </td>
            <td class="px-4 py-4 text-sm text-slate-600 dark:text-slate-400">
              ${coilIds} <span class="text-slate-400">(${coilCount} coil${coilCount !== 1 ? 's' : ''})</span>
            </td>
            <td class="px-4 py-4">
              <span class="inline-flex items-center px-2 py-1 rounded text-xs font-bold uppercase bg-blue-500/10 text-blue-500">
                ${link.selection_strategy}
              </span>
            </td>
            <td class="px-4 py-4 text-sm text-slate-600 dark:text-slate-400">
              ${formatDateTime(link.created_at)}
            </td>
            <td class="px-4 py-4 text-right">
              <button class="px-3 py-1.5 text-xs font-medium text-red-600 dark:text-red-400 bg-red-500/10 hover:bg-red-500/20 rounded transition-colors" data-link-id="${link.link_group_id}" data-sku="${link.product_sku}">
                Delete
              </button>
            </td>
          </tr>
        `;
      });

      html += `
            </tbody>
          </table>
        </div>
      `;

      container.innerHTML = html;

      // Add delete button handlers
      const deleteButtons = container.querySelectorAll('button[data-link-id]');
      deleteButtons.forEach(button => {
        button.addEventListener('click', async () => {
          await handleDelete(button.dataset.linkId, button.dataset.sku);
        });
      });
    }

    // Show create link modal
    function showCreateLinkModal() {
      const content = document.createElement('div');
      content.className = 'flex flex-col gap-4';
      content.innerHTML = `
        <div>
          <label for="product-sku-input" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">Product SKU</label>
          <input type="text" id="product-sku-input" class="w-full px-4 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg text-slate-900 dark:text-white focus:ring-2 focus:ring-primary focus:border-transparent" placeholder="e.g., COKE-001" required />
          <p class="mt-1 text-xs text-slate-500">Enter a unique product identifier</p>
        </div>

        <div>
          <label for="coil-ids-input" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">Linked Coil IDs</label>
          <input type="text" id="coil-ids-input" class="w-full px-4 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg text-slate-900 dark:text-white focus:ring-2 focus:ring-primary focus:border-transparent" placeholder="e.g., A1, B1, C1" required />
          <p class="mt-1 text-xs text-slate-500">Enter coil IDs separated by commas (e.g., A1, B1, C1). Max 10 coils.</p>
        </div>

        <div class="p-4 bg-slate-50 dark:bg-slate-800 rounded-lg">
          <p class="text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Selection Strategy</p>
          <p class="text-sm text-slate-600 dark:text-slate-400">
            <strong>First Available:</strong> Selects the first coil with inventory > 0
          </p>
        </div>
      `;

      showModal({
        title: 'Create Product Link',
        content,
        buttons: [
          {
            text: 'Cancel',
            className: 'px-4 py-2 text-slate-700 dark:text-slate-300 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-lg font-medium transition-colors',
            onClick: () => true
          },
          {
            text: 'Create',
            className: 'px-4 py-2 bg-primary text-white hover:bg-blue-600 rounded-lg font-medium transition-colors',
            onClick: async () => {
              await handleCreate();
              return false; // Don't close yet
            }
          }
        ]
      });

      // Focus SKU input
      setTimeout(() => {
        document.getElementById('product-sku-input')?.focus();
      }, 100);
    }

    // Handle create link
    async function handleCreate() {
      const skuInput = document.getElementById('product-sku-input');
      const coilIdsInput = document.getElementById('coil-ids-input');

      const sku = skuInput.value.trim();
      const coilIdsStr = coilIdsInput.value.trim();

      // Validate SKU
      const skuValidation = validateProductSku(sku);
      if (!skuValidation.valid) {
        showToast(skuValidation.error, 'error');
        skuInput.focus();
        return;
      }

      // Parse coil IDs
      const coilIds = coilIdsStr.split(',').map(id => id.trim().toUpperCase()).filter(id => id.length > 0);

      if (coilIds.length === 0) {
        showToast('Please enter at least one coil ID', 'error');
        coilIdsInput.focus();
        return;
      }

      if (coilIds.length > 10) {
        showToast('Maximum 10 coils can be linked to a product', 'error');
        coilIdsInput.focus();
        return;
      }

      try {
        await createProductLink(sku, coilIds);
        showToast(`Product link created for ${sku}`, 'success');

        // Close modal
        const modals = document.querySelectorAll('.modal-overlay');
        modals.forEach(m => m.remove());

        // Reload table
        await loadProductLinks();

      } catch (error) {
        console.error('Failed to create product link:', error);
        showToast('Failed to create product link: ' + error.message, 'error');
      }
    }

    // Handle delete link
    async function handleDelete(linkId, sku) {
      const confirmed = await confirmDialog(
        `Delete product link for ${sku}?\n\nThis will unlink all associated coils.`,
        'Delete Product Link',
        {
          confirmText: 'Delete',
          confirmClass: 'px-4 py-2 bg-red-500 text-white hover:bg-red-600 rounded-lg font-medium transition-colors'
        }
      );

      if (!confirmed) {
        return;
      }

      try {
        await deleteProductLink(linkId);
        showToast(`Product link deleted for ${sku}`, 'success');
        await loadProductLinks();

      } catch (error) {
        console.error('Failed to delete product link:', error);
        showToast('Failed to delete product link: ' + error.message, 'error');
      }
    }

    // Initialize
    initPage().catch(error => {
      console.error('Page initialization failed:', error);
    });
  </script>
</body>
</html>
