<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jam Management - ZootBox Portal</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet"/>

  <!-- Material Symbols -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

  <!-- Tailwind Config -->
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#0d7ff2",
            "background-light": "#f5f7f8",
            "background-dark": "#101922",
          },
          fontFamily: {
            "display": ["Inter"]
          },
          borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
        },
      },
    }
  </script>
</head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-white font-display overflow-hidden">

  <div class="flex h-screen w-full bg-background-light dark:bg-background-dark">

    <!-- Left Sidebar -->
    <div id="sidebar" class="hidden md:flex flex-col w-64 border-r border-slate-200 dark:border-slate-800 bg-white dark:bg-[#111418] shrink-0">
      <!-- Sidebar content will be rendered by Sidebar.js -->
    </div>

    <!-- Main Content Area -->
    <div class="flex-1 flex flex-col min-w-0 overflow-hidden">

      <!-- Header -->
      <header class="h-16 flex items-center justify-between px-6 border-b border-slate-200 dark:border-slate-800 bg-white dark:bg-[#111418] shrink-0">
        <div class="flex items-center gap-4">
          <h2 class="text-lg font-bold">Jam Management</h2>
        </div>
        <div class="flex items-center gap-3">
          <!-- Theme Toggle -->
          <div id="theme-toggle-container"></div>
        </div>
      </header>

      <!-- Main Content -->
      <main class="flex-1 overflow-y-auto p-6 md:p-8 bg-background-light dark:bg-background-dark">
        <div class="max-w-6xl mx-auto flex flex-col gap-6">

          <!-- Page Header -->
          <div class="flex justify-between items-start">
            <div>
              <h1 class="text-2xl font-bold mb-2">Jam Events</h1>
              <p class="text-slate-500 dark:text-slate-400 text-sm">
                Monitor and resolve coil jam events across your vending machines.
              </p>
            </div>
            <button id="refresh-jams-btn" class="flex items-center gap-2 px-4 py-2 bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-lg text-sm font-medium transition-colors">
              <span class="material-symbols-outlined text-[18px]">refresh</span>
              Refresh
            </button>
          </div>

          <!-- Filter Bar -->
          <div class="bg-white dark:bg-[#111418] rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm p-4">
            <div class="flex items-center gap-3">
              <label for="status-filter" class="text-sm font-medium text-slate-700 dark:text-slate-300">Filter by Status:</label>
              <select id="status-filter" class="px-4 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg text-sm text-slate-900 dark:text-white focus:ring-2 focus:ring-primary focus:border-transparent">
                <option value="all">All Jams</option>
                <option value="open" selected>Open Jams Only</option>
                <option value="resolved">Resolved Jams</option>
              </select>
            </div>
          </div>

          <!-- Jams Table -->
          <div class="bg-white dark:bg-[#111418] rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm overflow-hidden">
            <div class="px-6 py-4 border-b border-slate-200 dark:border-slate-800">
              <h3 class="text-lg font-bold">Jam History</h3>
            </div>

            <div id="jams-table-container" class="p-6">
              <div class="flex flex-col items-center justify-center gap-4 py-12">
                <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-primary"></div>
                <p class="text-slate-500">Loading jam events...</p>
              </div>
            </div>
          </div>

        </div>
      </main>
    </div>

  </div>

  <!-- Toast Container -->
  <div id="toast-container"></div>

  <!-- JavaScript Modules -->
  <script type="module">
    import { initSidebar } from './js/components/Sidebar.js';
    import { initThemeToggle, createThemeToggleButton } from './js/components/ThemeToggle.js';
    import { getJamEvents, resolveJamEvent, sortJamsByTimestamp } from './js/api/jams.js';
    import { getCurrentMachineId } from './js/state/machines.js';
    import { showToast } from './js/components/Toast.js';
    import { confirmDialog } from './js/components/Modal.js';
    import { formatDateTime, formatTimeAgo } from './js/utils/formatting.js';

    let currentJams = [];

    // Initialize page
    async function initPage() {
      // Initialize theme toggle
      initThemeToggle();

      // Add theme toggle button to header
      const themeToggleContainer = document.getElementById('theme-toggle-container');
      if (themeToggleContainer) {
        const toggleBtn = createThemeToggleButton({ iconOnly: true });
        themeToggleContainer.appendChild(toggleBtn);
      }

      // Initialize sidebar
      initSidebar();

      // Load jams
      await loadJams();

      // Status filter change handler
      document.getElementById('status-filter').addEventListener('change', async () => {
        await loadJams();
      });

      // Refresh button handler
      document.getElementById('refresh-jams-btn').addEventListener('click', async () => {
        await loadJams();
      });
    }

    // Load jam events
    async function loadJams() {
      const machineId = getCurrentMachineId();
      const container = document.getElementById('jams-table-container');

      if (!machineId) {
        container.innerHTML = `
          <div class="flex flex-col items-center justify-center gap-4 py-12">
            <span class="material-symbols-outlined text-6xl text-slate-300">devices</span>
            <h2 class="text-xl font-bold text-slate-700 dark:text-slate-300">No Machine Selected</h2>
            <p class="text-slate-500 dark:text-slate-400">Please select a machine from the dropdown above.</p>
          </div>
        `;
        return;
      }

      const statusFilter = document.getElementById('status-filter').value;

      try {
        const jams = await getJamEvents(statusFilter);
        currentJams = sortJamsByTimestamp(jams);

        if (currentJams.length === 0) {
          container.innerHTML = `
            <div class="flex flex-col items-center justify-center gap-4 py-12">
              <span class="material-symbols-outlined text-6xl text-emerald-300">check_circle</span>
              <h2 class="text-xl font-bold text-slate-700 dark:text-slate-300">No Jam Events</h2>
              <p class="text-slate-500 dark:text-slate-400">${statusFilter === 'open' ? 'No open jams found. All coils are operating normally.' : 'No jam events found.'}</p>
            </div>
          `;
          return;
        }

        renderJamsTable(currentJams);

      } catch (error) {
        console.error('Failed to load jams:', error);
        showToast('Failed to load jam events: ' + error.message, 'error');
        container.innerHTML = `
          <div class="flex flex-col items-center justify-center gap-4 py-12">
            <span class="material-symbols-outlined text-6xl text-red-500">error</span>
            <h2 class="text-xl font-bold text-slate-700 dark:text-slate-300">Error Loading Jams</h2>
            <p class="text-slate-500 dark:text-slate-400">${error.message}</p>
            <button class="px-4 py-2 bg-primary text-white rounded-lg font-medium hover:bg-blue-600 transition-colors" onclick="location.reload()">Retry</button>
          </div>
        `;
      }
    }

    // Render jams table
    function renderJamsTable(jams) {
      const container = document.getElementById('jams-table-container');

      let html = `
        <div class="overflow-x-auto">
          <table class="w-full">
            <thead class="bg-slate-50 dark:bg-[#1e2732] border-b border-slate-200 dark:border-slate-800">
              <tr>
                <th class="px-4 py-3 text-left text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Coil ID</th>
                <th class="px-4 py-3 text-left text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Timestamp</th>
                <th class="px-4 py-3 text-left text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Status</th>
                <th class="px-4 py-3 text-left text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Resolved At</th>
                <th class="px-4 py-3 text-left text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Duration</th>
                <th class="px-4 py-3 text-right text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Actions</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-slate-200 dark:divide-slate-800">
      `;

      jams.forEach(jam => {
        const duration = jam.resolved_at
          ? new Date(jam.resolved_at).getTime() - new Date(jam.timestamp).getTime()
          : Date.now() - new Date(jam.timestamp).getTime();

        const durationMinutes = Math.floor(duration / (60 * 1000));
        const durationText = durationMinutes < 60
          ? durationMinutes + 'm'
          : Math.floor(durationMinutes/60) + 'h ' + (durationMinutes%60) + 'm';

        const statusClass = jam.status === 'open'
          ? 'bg-red-500/10 text-red-500'
          : 'bg-emerald-500/10 text-emerald-500';

        html += `
          <tr class="hover:bg-slate-50 dark:hover:bg-[#1e2732] transition-colors">
            <td class="px-4 py-4">
              <div class="flex items-center gap-3">
                <div class="h-10 w-10 flex items-center justify-center bg-slate-100 dark:bg-slate-800 rounded-lg">
                  <span class="material-symbols-outlined text-slate-600 dark:text-slate-400">grid_on</span>
                </div>
                <span class="font-bold text-slate-900 dark:text-white">${jam.coil_id}</span>
              </div>
            </td>
            <td class="px-4 py-4 text-sm text-slate-600 dark:text-slate-400">
              ${formatDateTime(jam.timestamp)}
            </td>
            <td class="px-4 py-4">
              <span class="inline-flex items-center px-2 py-1 rounded text-xs font-bold uppercase ${statusClass}">
                ${jam.status}
              </span>
            </td>
            <td class="px-4 py-4 text-sm text-slate-600 dark:text-slate-400">
              ${jam.resolved_at ? formatDateTime(jam.resolved_at) : '-'}
            </td>
            <td class="px-4 py-4 text-sm text-slate-600 dark:text-slate-400">
              ${durationText}
            </td>
            <td class="px-4 py-4 text-right">
              ${jam.status === 'open'
                ? `<button class="px-3 py-1.5 text-xs font-medium text-emerald-600 dark:text-emerald-400 bg-emerald-500/10 hover:bg-emerald-500/20 rounded transition-colors" data-jam-id="${jam.id}" data-coil-id="${jam.coil_id}">Resolve</button>`
                : '<span class="text-sm text-slate-400">Resolved</span>'}
            </td>
          </tr>
        `;
      });

      html += `
            </tbody>
          </table>
        </div>
      `;

      container.innerHTML = html;

      // Add resolve button handlers
      const resolveButtons = container.querySelectorAll('button[data-jam-id]');
      resolveButtons.forEach(button => {
        button.addEventListener('click', async () => {
          await handleResolve(button.dataset.jamId, button.dataset.coilId);
        });
      });
    }

    // Handle jam resolution
    async function handleResolve(jamId, coilId) {
      const confirmed = await confirmDialog(
        `Resolve jam for coil ${coilId}?\n\nThis will mark the jam as resolved and set the coil status to available.`,
        'Resolve Jam',
        {
          confirmText: 'Resolve',
          confirmClass: 'btn-primary'
        }
      );

      if (!confirmed) {
        return;
      }

      try {
        await resolveJamEvent(jamId);
        showToast(`Jam resolved for coil ${coilId}`, 'success');
        await loadJams();

      } catch (error) {
        console.error('Failed to resolve jam:', error);
        showToast('Failed to resolve jam: ' + error.message, 'error');
      }
    }

    // Initialize
    initPage().catch(error => {
      console.error('Page initialization failed:', error);
    });
  </script>
</body>
</html>
