<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZootBox Inventory Portal</title>

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/navigation.css">
  <link rel="stylesheet" href="css/grid.css">
</head>
<body>
  <!-- Navigation (loaded from nav.html) -->
  <div id="nav-container"></div>

  <!-- Main Page Container -->
  <div class="page-container">
    <div class="content-wrapper">

      <!-- Page Header -->
      <div class="page-header">
        <h1>Inventory Grid</h1>
        <div class="page-actions">
          <button id="refill-all-btn" class="btn btn-success" disabled>
            Refill All Coils
          </button>
          <button id="refresh-btn" class="btn btn-secondary">
            Refresh Now
          </button>
        </div>
      </div>

      <!-- Status Bar -->
      <div class="status-bar">
        <div class="status-item">
          <span class="status-label">Connection:</span>
          <span id="connection-status-text" class="status-value">Checking...</span>
        </div>
        <div class="status-item">
          <span class="status-label">Last Sync:</span>
          <span id="last-sync-text" class="status-value">Never</span>
        </div>
        <div class="status-item">
          <span class="status-label">Low Stock:</span>
          <span id="low-stock-count" class="status-value">0 coils</span>
        </div>
        <div class="status-item">
          <span class="status-label">Jammed:</span>
          <span id="jammed-count" class="status-value">0 coils</span>
        </div>
      </div>

      <!-- Stale Data Banner (hidden by default) -->
      <div id="stale-data-banner" class="banner banner-warning hidden">
        <span id="stale-data-text">Data may be out of date. Last synced: N/A</span>
        <button id="retry-connection-btn" class="btn btn-secondary btn-sm">
          Retry Connection
        </button>
      </div>

      <!-- Grid Container -->
      <div class="grid-wrapper">
        <div id="coil-grid" class="coil-grid">
          <!-- Grid will be dynamically generated by CoilGrid.js -->
          <div class="grid-loading">
            <div class="loading"></div>
            <p>Loading inventory...</p>
          </div>
        </div>
      </div>

      <!-- Grid Legend -->
      <div class="grid-legend">
        <h3>Legend</h3>
        <div class="legend-items">
          <div class="legend-item">
            <div class="legend-color coil-cell coil-available"></div>
            <span>Available (3-10)</span>
          </div>
          <div class="legend-item">
            <div class="legend-color coil-cell coil-low-stock"></div>
            <span>Low Stock (1-2)</span>
          </div>
          <div class="legend-item">
            <div class="legend-color coil-cell coil-empty"></div>
            <span>Empty (0)</span>
          </div>
          <div class="legend-item">
            <div class="legend-color coil-cell coil-jammed"></div>
            <span>Jammed</span>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Toast Container (for notifications) -->
  <div id="toast-container"></div>

  <!-- JavaScript Modules -->
  <script type="module">
    import { loadNavigation } from './js/components/Navigation.js';
    import { initMachineSelector } from './js/components/MachineSelector.js';
    import { initCoilGrid } from './js/components/CoilGrid.js';
    import { initStatusIndicator } from './js/components/StatusIndicator.js';
    import { startAutoRefresh, stopAutoRefresh } from './js/state/sync.js';
    import { getCurrentMachineId } from './js/state/machines.js';

    // Initialize portal on page load
    async function initPortal() {
      // Load navigation
      await loadNavigation();

      // Initialize machine selector
      initMachineSelector();

      // Initialize status indicator
      initStatusIndicator();

      // Initialize coil grid
      initCoilGrid();

      // Check if machine is selected
      const currentMachineId = getCurrentMachineId();
      if (currentMachineId) {
        // Start auto-refresh
        startAutoRefresh();
      } else {
        // Show message to select machine
        document.getElementById('coil-grid').innerHTML = `
          <div class="empty-state">
            <h2>No Machine Selected</h2>
            <p>Please select a machine from the dropdown above or add a new machine in <a href="machine-settings.html">Machine Settings</a>.</p>
          </div>
        `;
      }

      // Refresh button handler
      document.getElementById('refresh-btn').addEventListener('click', async () => {
        const btn = document.getElementById('refresh-btn');
        btn.disabled = true;
        btn.innerHTML = '<span class="loading"></span> Refreshing...';

        // Reload grid
        const { refreshGrid } = await import('./js/components/CoilGrid.js');
        await refreshGrid();

        btn.disabled = false;
        btn.innerHTML = 'Refresh Now';
      });

      // Retry connection button handler
      document.getElementById('retry-connection-btn').addEventListener('click', () => {
        stopAutoRefresh();
        startAutoRefresh();
      });
    }

    // Run initialization
    initPortal().catch(error => {
      console.error('Portal initialization failed:', error);
      document.getElementById('coil-grid').innerHTML = `
        <div class="error-state">
          <h2>Initialization Error</h2>
          <p>${error.message}</p>
          <button class="btn btn-primary" onclick="location.reload()">Reload Page</button>
        </div>
      `;
    });
  </script>
</body>
</html>
