<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory Map - ZootBox Portal</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet"/>

  <!-- Material Symbols -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

  <!-- Tailwind Config -->
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#0d7ff2",
            "background-light": "#f5f7f8",
            "background-dark": "#101922",
          },
          fontFamily: {
            "display": ["Inter"]
          },
          borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
        },
      },
    }
  </script>

  <style>
    /* Loading spinner */
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loading-spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }
  </style>
</head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-white font-display overflow-hidden">

  <div class="flex h-screen w-full bg-background-light dark:bg-background-dark">

    <!-- Left Sidebar -->
    <div id="sidebar" class="hidden md:flex flex-col w-64 border-r border-slate-200 dark:border-slate-800 bg-white dark:bg-[#111418] shrink-0">
      <!-- Sidebar content will be rendered by Sidebar.js -->
    </div>

    <!-- Main Content Area -->
    <div class="flex-1 flex flex-col min-w-0 overflow-hidden">

      <!-- Header -->
      <header class="h-16 flex items-center justify-between px-6 border-b border-slate-200 dark:border-slate-800 bg-white dark:bg-[#111418] shrink-0">
        <div class="flex items-center gap-4">
          <h2 class="text-lg font-bold">Inventory Map</h2>
        </div>
        <div class="flex items-center gap-6">
          <!-- Search (hidden on small screens) -->
          <div class="relative hidden sm:block">
            <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-[20px]">search</span>
            <input id="search-input" class="pl-10 pr-4 py-2 bg-slate-100 dark:bg-[#283039] border-none rounded-lg text-sm text-slate-900 dark:text-white placeholder-slate-400 w-64 focus:ring-2 focus:ring-primary" placeholder="Search product or slot..." type="text"/>
          </div>
          <div class="flex items-center gap-3">
            <!-- Machine Selector -->
            <select id="machine-select-header" class="bg-slate-100 dark:bg-[#283039] border-none rounded-lg text-sm px-3 py-2 focus:ring-2 focus:ring-primary">
              <option value="">Select machine...</option>
            </select>

            <!-- Notifications -->
            <button class="p-2 text-slate-500 hover:text-slate-700 dark:hover:text-white transition-colors relative">
              <span class="material-symbols-outlined">notifications</span>
              <span id="notification-badge" class="hidden absolute top-1.5 right-1.5 size-2 bg-red-500 rounded-full border-2 border-white dark:border-[#111418]"></span>
            </button>

            <!-- Help -->
            <button class="p-2 text-slate-500 hover:text-slate-700 dark:hover:text-white transition-colors">
              <span class="material-symbols-outlined">help</span>
            </button>

            <!-- Theme Toggle -->
            <div id="theme-toggle-container"></div>
          </div>
        </div>
      </header>

      <!-- Main Content -->
      <main class="flex-1 overflow-y-auto p-6 md:p-8 bg-background-light dark:bg-background-dark">
        <div class="max-w-[1400px] mx-auto flex flex-col gap-6">

          <!-- Stat Cards -->
          <div id="stat-cards" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
            <!-- Cards will be rendered by StatCards.js -->
          </div>

          <!-- Filter Bar + Actions -->
          <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <div class="flex flex-wrap gap-2">
              <button id="filter-all" class="px-4 py-2 bg-slate-800 dark:bg-white text-white dark:text-slate-900 rounded-lg text-sm font-medium shadow-sm transition-transform active:scale-95">
                All Rows
              </button>
              <button id="filter-low-stock" class="px-4 py-2 bg-white dark:bg-[#283039] hover:bg-slate-50 dark:hover:bg-[#323b46] border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200 rounded-lg text-sm font-medium flex items-center gap-2 transition-colors">
                <span class="size-2 rounded-full bg-orange-500"></span>
                Low Stock
              </button>
              <button id="filter-empty" class="px-4 py-2 bg-white dark:bg-[#283039] hover:bg-slate-50 dark:hover:bg-[#323b46] border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200 rounded-lg text-sm font-medium flex items-center gap-2 transition-colors">
                <span class="size-2 rounded-full bg-red-500"></span>
                Empty
              </button>
              <button id="filter-full" class="px-4 py-2 bg-white dark:bg-[#283039] hover:bg-slate-50 dark:hover:bg-[#323b46] border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200 rounded-lg text-sm font-medium flex items-center gap-2 transition-colors">
                <span class="size-2 rounded-full bg-primary"></span>
                Full
              </button>
            </div>
            <div class="flex gap-3">
              <button id="sync-machine-btn" class="flex items-center gap-2 px-4 py-2 bg-primary text-white rounded-lg text-sm font-bold shadow-lg shadow-primary/20 hover:bg-blue-600 transition-colors">
                <span class="material-symbols-outlined text-[18px]">sync</span>
                Sync Machine
              </button>
            </div>
          </div>

          <!-- Inventory Grid -->
          <div id="coil-grid" class="rounded-xl overflow-hidden border border-slate-200 dark:border-slate-800 bg-white dark:bg-[#111418] shadow-sm">
            <!-- Grid will be dynamically generated by CoilGrid.js -->
            <div class="flex flex-col items-center justify-center gap-4 p-12 text-slate-500">
              <div class="loading-spinner" style="width: 32px; height: 32px; border-width: 3px;"></div>
              <p>Loading inventory...</p>
            </div>
          </div>

        </div>
      </main>
    </div>

  </div>

  <!-- Toast Container (for notifications) -->
  <div id="toast-container"></div>

  <!-- JavaScript Modules -->
  <script type="module">
    import { initSidebar } from './js/components/Sidebar.js';
    import { initThemeToggle, createThemeToggleButton } from './js/components/ThemeToggle.js';
    import { initMachineSelector } from './js/components/MachineSelector.js';
    import { initCoilGrid } from './js/components/CoilGrid.js';
    import { initStatCards } from './js/components/StatCards.js';
    import { initEditPanel } from './js/components/EditPanel.js';
    import { startAutoRefresh, stopAutoRefresh } from './js/state/sync.js';
    import { getCurrentMachineId } from './js/state/machines.js';

    // Initialize portal on page load
    async function initPortal() {
      // Set API client baseURL from current machine (if any)
      const { getCurrentMachine } = await import('./js/state/machines.js');
      const { apiClient } = await import('./js/api/client.js');
      const currentMachine = getCurrentMachine();
      if (currentMachine && currentMachine.endpointUrl) {
        apiClient.setBaseURL(currentMachine.endpointUrl);
        console.log(`API client set to: ${currentMachine.endpointUrl}`);
      }

      // Initialize theme toggle
      initThemeToggle();

      // Add theme toggle button to header
      const themeToggleContainer = document.getElementById('theme-toggle-container');
      if (themeToggleContainer) {
        const toggleBtn = createThemeToggleButton({ iconOnly: true });
        themeToggleContainer.appendChild(toggleBtn);
      }

      // Initialize sidebar
      initSidebar();

      // Initialize machine selector (both sidebar and header)
      initMachineSelector();

      // Populate header machine selector
      const headerSelect = document.getElementById('machine-select-header');
      if (headerSelect) {
        // Import and use machine selector logic
        const { getMachines, getCurrentMachineId, setCurrentMachine } = await import('./js/state/machines.js');
        const machines = getMachines();
        const currentId = getCurrentMachineId();

        machines.forEach(machine => {
          const option = document.createElement('option');
          option.value = machine.id;
          option.textContent = machine.name;
          if (machine.id === currentId) {
            option.selected = true;
          }
          headerSelect.appendChild(option);
        });

        // Handle machine change
        headerSelect.addEventListener('change', (e) => {
          setCurrentMachine(e.target.value);
          location.reload(); // Reload to update grid
        });
      }

      // Initialize stat cards
      const statCardsContainer = document.getElementById('stat-cards');
      initStatCards(statCardsContainer);

      // Initialize coil grid
      initCoilGrid();

      // Initialize edit panel
      initEditPanel();

      // Check if machine is selected
      const currentMachineId = getCurrentMachineId();
      if (currentMachineId) {
        // Start auto-refresh
        startAutoRefresh();
      } else {
        // Show message to select machine
        const gridContainer = document.getElementById('coil-grid');
        if (gridContainer) {
          gridContainer.innerHTML = `
            <div class="flex flex-col items-center justify-center gap-4 p-12">
              <span class="material-symbols-outlined text-6xl text-slate-300">devices</span>
              <h2 class="text-xl font-bold text-slate-700 dark:text-slate-300">No Machine Selected</h2>
              <p class="text-slate-500 dark:text-slate-400 text-center max-w-md">
                Please select a machine from the dropdown above or add a new machine in
                <a href="machine-settings.html" class="text-primary hover:underline">Machine Settings</a>.
              </p>
            </div>
          `;
        }
      }

      // Sync machine button handler
      document.getElementById('sync-machine-btn')?.addEventListener('click', async () => {
        const btn = document.getElementById('sync-machine-btn');
        if (!btn) return;

        btn.disabled = true;
        btn.innerHTML = '<span class="loading-spinner"></span> Syncing...';

        try {
          const { refreshGrid } = await import('./js/components/CoilGrid.js');
          await refreshGrid();

          btn.disabled = false;
          btn.innerHTML = '<span class="material-symbols-outlined text-[18px]">sync</span> Sync Machine';
        } catch (error) {
          console.error('Sync failed:', error);
          btn.disabled = false;
          btn.innerHTML = '<span class="material-symbols-outlined text-[18px]">sync</span> Sync Machine';
        }
      });

      // Filter buttons
      let currentFilter = 'all';

      document.getElementById('filter-all')?.addEventListener('click', () => {
        setActiveFilter('all');
      });

      document.getElementById('filter-low-stock')?.addEventListener('click', () => {
        setActiveFilter('low-stock');
      });

      document.getElementById('filter-empty')?.addEventListener('click', () => {
        setActiveFilter('empty');
      });

      document.getElementById('filter-full')?.addEventListener('click', () => {
        setActiveFilter('full');
      });

      function setActiveFilter(filter) {
        currentFilter = filter;

        // Update button styles
        const buttons = {
          'all': document.getElementById('filter-all'),
          'low-stock': document.getElementById('filter-low-stock'),
          'empty': document.getElementById('filter-empty'),
          'full': document.getElementById('filter-full')
        };

        Object.entries(buttons).forEach(([key, btn]) => {
          if (!btn) return;
          if (key === filter) {
            btn.className = 'px-4 py-2 bg-slate-800 dark:bg-white text-white dark:text-slate-900 rounded-lg text-sm font-medium shadow-sm transition-transform active:scale-95';
          } else {
            btn.className = 'px-4 py-2 bg-white dark:bg-[#283039] hover:bg-slate-50 dark:hover:bg-[#323b46] border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200 rounded-lg text-sm font-medium flex items-center gap-2 transition-colors';

            // Re-add colored dot
            if (key === 'low-stock') {
              btn.innerHTML = '<span class="size-2 rounded-full bg-orange-500"></span> Low Stock';
            } else if (key === 'empty') {
              btn.innerHTML = '<span class="size-2 rounded-full bg-red-500"></span> Empty';
            } else if (key === 'full') {
              btn.innerHTML = '<span class="size-2 rounded-full bg-primary"></span> Full';
            }
          }
        });

        // Apply filter to grid
        applyGridFilter(filter);
      }

      function applyGridFilter(filter) {
        // This will be implemented in CoilGrid.js
        const grid = document.getElementById('coil-grid');
        if (!grid) return;

        const rows = grid.querySelectorAll('[data-row]');
        rows.forEach(row => {
          const coils = row.querySelectorAll('[data-coil-id]');
          let shouldShow = false;

          if (filter === 'all') {
            shouldShow = true;
          } else {
            coils.forEach(coil => {
              const inventory = parseInt(coil.dataset.inventory || '0');

              if (filter === 'low-stock' && inventory > 0 && inventory <= 2) {
                shouldShow = true;
              } else if (filter === 'empty' && inventory === 0) {
                shouldShow = true;
              } else if (filter === 'full' && inventory >= 8) {
                shouldShow = true;
              }
            });
          }

          row.style.display = shouldShow ? '' : 'none';
        });
      }
    }

    // Run initialization
    initPortal().catch(error => {
      console.error('Portal initialization failed:', error);
      const gridContainer = document.getElementById('coil-grid');
      if (gridContainer) {
        gridContainer.innerHTML = `
          <div class="flex flex-col items-center justify-center gap-4 p-12">
            <span class="material-symbols-outlined text-6xl text-red-500">error</span>
            <h2 class="text-xl font-bold text-slate-700 dark:text-slate-300">Initialization Error</h2>
            <p class="text-slate-500 dark:text-slate-400">${error.message}</p>
            <button class="px-4 py-2 bg-primary text-white rounded-lg font-medium" onclick="location.reload()">
              Reload Page
            </button>
          </div>
        `;
      }
    });
  </script>
</body>
</html>
